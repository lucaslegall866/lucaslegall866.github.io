<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucas Le Gall</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --fond: #0f1115;
      --fond-clair: #1a1d24;
      --texte: #e8e8e8;
      --accent: #e04040;
      --gris: #9aa0aa;
    }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fond);
      color: var(--texte);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .hub {
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 2.8rem;
      margin-bottom: 12px;
    }
    .intro {
      color: var(--gris);
      margin-bottom: 48px;
      font-size: 1.1rem;
    }
    .projets {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .projet {
      display: block;
      background: var(--fond-clair);
      border-radius: 12px;
      padding: 24px;
      text-decoration: none;
      color: var(--texte);
      transition: transform 0.2s, background 0.2s;
      text-align: left;
    }
    .projet:hover {
      transform: translateY(-3px);
      background: #21252e;
    }
    .projet h2 {
      font-size: 1.3rem;
      margin-bottom: 4px;
    }
    .projet p {
      color: var(--gris);
      font-size: 0.95rem;
    }
    .fleche { color: var(--accent); }
    footer {
      margin-top: 48px;
      color: var(--gris);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="hub">
    <h1>Lucas Le Gall</h1>
    <p class="intro">[Une phrase sur toi — ce que tu fais, ce que tu explores.]</p>

    <div class="projets">
      <!-- Un lien = un projet. Duplique ce bloc pour en ajouter. -->
      <a class="projet" href="/musique/">
        <h2>Mixage &amp; Mastering <span class="fleche">→</span></h2>
        <p>Mon portfolio audio : avant/après, travaux, contact.</p>
      </a>

      <a class="projet" href="/rubikscube-cfop/">
        <h2>Rubik's cube - méthode CFOP <span class="fleche">→</span></h2>
        <p>Mes formules pour la méthode CFOP</p>
      </a>

      <!-- Exemple de futur projet (décommente et adapte quand tu en auras un) :
      <a class="projet" href="/autre-projet/">
        <h2>Autre projet <span class="fleche">→</span></h2>
        <p>Description courte du projet.</p>
      </a>
      -->
    </div>

    <footer>© <span id="annee"></span> Lucas Le Gall</footer>
  </div>

  <script>
    document.getElementById("annee").textContent = new Date().getFullYear();
  </script>
</body>
</html>
